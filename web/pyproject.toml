[project]
name = "saorsa-web"
version = "0.1.3"
description = "Testnet deployment registry - web service and REST API"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.1",
    "gunicorn>=23.0",
    "alembic>=1.15",
    "requests>=2.31",
    "authlib>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
registry-monitor = "saorsa_web.cli:main"
