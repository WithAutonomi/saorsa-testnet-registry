[project]
name = "saorsa-web"
version = "1.4.1"
description = "Testnet deployment registry - web service and REST API"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",
    "saorsa-db",
    "python-dotenv>=1.1",
    "gunicorn>=23.0",
]

[tool.uv.sources]
saorsa-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

