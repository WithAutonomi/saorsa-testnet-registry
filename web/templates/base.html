<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Saorsa Testnet Registry{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-gray-900 min-h-screen flex flex-col">
    <header class="bg-slate-900 shadow-lg">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
            <a href="/deployments" class="text-xl font-semibold text-white hover:text-brand-400 transition-colors">
                Saorsa Testnet Registry
            </a>
            <nav class="flex items-center gap-4 text-sm">
                {% if current_user %}
                    <span class="text-slate-400">{{ current_user.username }}</span>
                    <a href="{{ url_for('auth.tokens_page') }}" class="text-slate-300 hover:text-white transition-colors">API Tokens</a>
                    <a href="{{ url_for('auth.logout') }}" class="text-slate-300 hover:text-white transition-colors">Logout</a>
                {% else %}
                    <a href="{{ url_for('auth.login') }}" class="text-slate-300 hover:text-white transition-colors">Login</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="flex-1 max-w-6xl mx-auto px-4 sm:px-6 py-8 w-full">
        {% block content %}{% endblock %}
    </main>
    <footer class="border-t border-slate-200 bg-white">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 text-center text-xs text-slate-400">
            v{{ app_version }}
        </div>
    </footer>
</body>
</html>
