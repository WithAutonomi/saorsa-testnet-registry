{% extends "base.html" %}
{% block title %}Authentication Error - Saorsa Testnet Registry{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto mt-12 text-center">
    <div class="bg-white rounded-lg border border-red-200 shadow-sm p-8">
        <h2 class="text-2xl font-semibold text-gray-900 mb-4">Authentication Error</h2>
        <p class="text-sm text-red-600 mb-6">{{ error }}</p>
        <div class="flex items-center justify-center gap-4 text-sm">
            <a href="{{ url_for('auth.login') }}" class="text-brand-600 hover:text-brand-700 transition-colors">Try again</a>
            <span class="text-gray-300">|</span>
            <a href="{{ url_for('web.web_deployments.list_deployments') }}" class="text-gray-600 hover:text-gray-900 transition-colors">Home</a>
        </div>
    </div>
</div>
{% endblock %}
