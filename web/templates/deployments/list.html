{% extends "base.html" %}

{% block title %}Deployments - Saorsa Testnet Registry{% endblock %}

{% block content %}
<h2>Deployments</h2>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Status</th>
            <th>Created</th>
            <th>Updated</th>
        </tr>
    </thead>
    <tbody id="deployment-list" hx-get="/api/deployments" hx-trigger="every 30s" hx-swap="none">
        {% for deployment in deployments %}
        {% include "deployments/_row.html" %}
        {% else %}
        <tr><td colspan="5">No deployments found.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
