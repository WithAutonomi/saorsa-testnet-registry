<tr id="deployment-{{ deployment.id }}">
    <td>{{ deployment.id }}</td>
    <td>{{ deployment.name }}</td>
    <td class="status-{{ deployment.status.value }}">{{ deployment.status.value }}</td>
    <td>{{ deployment.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
    <td>{{ deployment.updated_at.strftime('%Y-%m-%d %H:%M') }}</td>
    <td>
        {% if deployment.status.value in ('running', 'stopped') %}
        <button hx-post="/api/deployments/destroy"
                hx-vals='{"name": "{{ deployment.name }}"}'
                hx-confirm="Are you sure you want to destroy '{{ deployment.name }}'?"
                hx-target="#deployment-{{ deployment.id }}"
                hx-swap="outerHTML"
                hx-headers='{"Content-Type": "application/json"}'
                class="btn-destroy">
            Destroy
        </button>
        {% endif %}
    </td>
</tr>
