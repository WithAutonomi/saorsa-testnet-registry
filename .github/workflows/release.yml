name: Release

# Every merge to `main` that carries a version bump becomes a tagged GitHub
# release with the two wheels an antops run installs. The GitHub release is the
# wheel store — no package index is involved anywhere.
#
# A merge that declared `Semantic version: none` leaves the version alone, so
# the tag already exists and this job does nothing.

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("deploy/pyproject.toml").read_text())["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already exists — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the wheels
        if: steps.version.outputs.release == 'true'
        run: |
          set -euo pipefail
          uv build --package saorsa-db --wheel -o dist
          uv build --package saorsa-deploy --wheel -o dist
          ls -l dist

      - name: Write the release notes
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          previous=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$previous" ]; then
            range="$previous..HEAD"
            echo "Changes since $previous:" > "$notes"
          else
            range="HEAD"
            echo "Changes:" > "$notes"
          fi
          echo "" >> "$notes"
          # Merge commits name their PR; `gh` supplies the title, which the
          # merge commit's subject does not carry.
          numbers=$(git log $range --merges --pretty=%s | grep -oE 'pull request #[0-9]+' | grep -oE '[0-9]+' || true)
          if [ -n "$numbers" ]; then
            for number in $numbers; do
              gh pr view "$number" --json number,title \
                -q '"- #" + (.number|tostring) + " " + .title' >> "$notes" || \
                echo "- #$number" >> "$notes"
            done
          else
            git log $range --no-merges --pretty='- %s' >> "$notes"
          fi
          cat "$notes"

      - name: Create the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" dist/*.whl \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
          gh release view "v$VERSION"
