name: Launch Network

on:
  workflow_dispatch:
    inputs:
      deploy_args:
        description: >
          JSON string containing all deployment arguments.
          Schema:
            {
              "name": "DEV-01",           (required) Deployment name
              "vm_count": 3,              (required) Number of VMs
              "node_count": 25,           (required) Number of nodes
              "genesis_port": 12000,      (required) Genesis port
              "testnet": true,            (optional) Use testnet flag
              "attached_volume_size": 20, (optional) Volume size in GB
              "region_counts": "3",       (optional) Region counts
              "ip_version": "v4",         (optional) IP version (v4/v6)
              "log_level": "info",        (optional) Log level
              "port": null,               (optional) Port number
              "region": null,             (optional) Region name
              "node_version": "0.3.3",    (optional) Specific node release version
              "branch_name": null,        (optional) Node repo branch to build from
              "repo_owner": "maidsafe",   (optional) Repo owner for branch builds
              "disable_log_forwarding": false (optional) Disable Telegraf log forwarding
              "upgrade_channel": "beta",    (optional) Upgrade channel (beta/stable)
            }
          Required fields: name, vm_count, node_count, genesis_port
          Note: node_version and branch_name are mutually exclusive
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DO_TOKEN: ${{ secrets.SAORSA_DEPLOY_DO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SAORSA_DEPLOY_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SAORSA_DEPLOY_AWS_SECRET_ACCESS_KEY }}
      SAORSA_BUILD_AWS_ACCESS_KEY_ID: ${{ secrets.SAORSA_BUILD_AWS_ACCESS_KEY_ID }}
      SAORSA_BUILD_AWS_SECRET_ACCESS_KEY: ${{ secrets.SAORSA_BUILD_AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Parse deploy_args JSON
        id: args
        run: |
          DEPLOY_ARGS='${{ inputs.deploy_args }}'

          echo "name=$(echo "$DEPLOY_ARGS" | jq -r '.name')" >> "$GITHUB_OUTPUT"
          echo "vm_count=$(echo "$DEPLOY_ARGS" | jq -r '.vm_count')" >> "$GITHUB_OUTPUT"
          echo "node_count=$(echo "$DEPLOY_ARGS" | jq -r '.node_count')" >> "$GITHUB_OUTPUT"
          echo "genesis_port=$(echo "$DEPLOY_ARGS" | jq -r '.genesis_port')" >> "$GITHUB_OUTPUT"
          echo "testnet=$(echo "$DEPLOY_ARGS" | jq -r '.testnet // empty')" >> "$GITHUB_OUTPUT"
          echo "attached_volume_size=$(echo "$DEPLOY_ARGS" | jq -r '.attached_volume_size // empty')" >> "$GITHUB_OUTPUT"
          echo "region_counts=$(echo "$DEPLOY_ARGS" | jq -r '.region_counts // empty')" >> "$GITHUB_OUTPUT"
          echo "ip_version=$(echo "$DEPLOY_ARGS" | jq -r '.ip_version // empty')" >> "$GITHUB_OUTPUT"
          echo "log_level=$(echo "$DEPLOY_ARGS" | jq -r '.log_level // empty')" >> "$GITHUB_OUTPUT"
          echo "port=$(echo "$DEPLOY_ARGS" | jq -r '.port // empty')" >> "$GITHUB_OUTPUT"
          echo "region=$(echo "$DEPLOY_ARGS" | jq -r '.region // empty')" >> "$GITHUB_OUTPUT"
          echo "node_version=$(echo "$DEPLOY_ARGS" | jq -r '.node_version // empty')" >> "$GITHUB_OUTPUT"
          echo "branch_name=$(echo "$DEPLOY_ARGS" | jq -r '.branch_name // empty')" >> "$GITHUB_OUTPUT"
          echo "repo_owner=$(echo "$DEPLOY_ARGS" | jq -r '.repo_owner // empty')" >> "$GITHUB_OUTPUT"
          echo "disable_log_forwarding=$(echo "$DEPLOY_ARGS" | jq -r '.disable_log_forwarding // empty')" >> "$GITHUB_OUTPUT"
          echo "upgrade_channel=$(echo "$DEPLOY_ARGS" | jq -r '.upgrade_channel // empty')" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install saorsa-deploy
        run: pip install ./deploy

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SAORSA_DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Build custom saorsa-node binary
        if: steps.args.outputs.branch_name != ''
        run: |
          CMD="saorsa-deploy build-saorsa-node-binary"
          CMD="$CMD --name ${{ steps.args.outputs.name }}"
          CMD="$CMD --branch-name ${{ steps.args.outputs.branch_name }}"

          if [ -n "${{ steps.args.outputs.repo_owner }}" ]; then
            CMD="$CMD --repo-owner ${{ steps.args.outputs.repo_owner }}"
          fi

          echo "Running: $CMD"
          eval "$CMD"

      - name: Run saorsa-deploy infra
        run: |
          CMD="saorsa-deploy infra"
          CMD="$CMD --name ${{ steps.args.outputs.name }}"
          CMD="$CMD --vm-count ${{ steps.args.outputs.vm_count }}"
          CMD="$CMD --force"

          if [ -n "${{ steps.args.outputs.attached_volume_size }}" ]; then
            CMD="$CMD --attached-volume-size ${{ steps.args.outputs.attached_volume_size }}"
          fi
          if [ -n "${{ steps.args.outputs.region_counts }}" ]; then
            CMD="$CMD --region-counts ${{ steps.args.outputs.region_counts }}"
          fi
          if [ "${{ steps.args.outputs.testnet }}" = "true" ]; then
            CMD="$CMD --testnet"
          fi

          echo "Running: $CMD"
          eval "$CMD"

      - name: Run saorsa-deploy provision-genesis
        run: |
          CMD="saorsa-deploy provision-genesis"
          CMD="$CMD --name ${{ steps.args.outputs.name }}"
          CMD="$CMD --port ${{ steps.args.outputs.genesis_port }}"

          if [ -n "${{ steps.args.outputs.ip_version }}" ]; then
            CMD="$CMD --ip-version ${{ steps.args.outputs.ip_version }}"
          fi
          if [ -n "${{ steps.args.outputs.log_level }}" ]; then
            CMD="$CMD --log-level ${{ steps.args.outputs.log_level }}"
          fi
          if [ "${{ steps.args.outputs.testnet }}" = "true" ]; then
            CMD="$CMD --testnet"
          fi
          if [ -n "${{ steps.args.outputs.node_version }}" ]; then
            CMD="$CMD --node-version ${{ steps.args.outputs.node_version }}"
          fi
          if [ -n "${{ steps.args.outputs.branch_name }}" ]; then
            CMD="$CMD --branch-name ${{ steps.args.outputs.branch_name }}"
          fi
          if [ -n "${{ steps.args.outputs.repo_owner }}" ]; then
            CMD="$CMD --repo-owner ${{ steps.args.outputs.repo_owner }}"
          fi
          if [ -n "${{ steps.args.outputs.upgrade_channel }}" ]; then
            CMD="$CMD --upgrade-channel ${{ steps.args.outputs.upgrade_channel }}"
          fi

          echo "Running: $CMD"
          eval "$CMD"

      - name: Run saorsa-deploy provision
        run: |
          CMD="saorsa-deploy provision"
          CMD="$CMD --name ${{ steps.args.outputs.name }}"
          CMD="$CMD --node-count ${{ steps.args.outputs.node_count }}"

          if [ -n "${{ steps.args.outputs.ip_version }}" ]; then
            CMD="$CMD --ip-version ${{ steps.args.outputs.ip_version }}"
          fi
          if [ -n "${{ steps.args.outputs.port }}" ]; then
            CMD="$CMD --port ${{ steps.args.outputs.port }}"
          fi
          if [ -n "${{ steps.args.outputs.region }}" ]; then
            CMD="$CMD --region ${{ steps.args.outputs.region }}"
          fi
          if [ -n "${{ steps.args.outputs.log_level }}" ]; then
            CMD="$CMD --log-level ${{ steps.args.outputs.log_level }}"
          fi
          if [ "${{ steps.args.outputs.testnet }}" = "true" ]; then
            CMD="$CMD --testnet"
          fi
          if [ -n "${{ steps.args.outputs.node_version }}" ]; then
            CMD="$CMD --node-version ${{ steps.args.outputs.node_version }}"
          fi
          if [ -n "${{ steps.args.outputs.branch_name }}" ]; then
            CMD="$CMD --branch-name ${{ steps.args.outputs.branch_name }}"
          fi
          if [ -n "${{ steps.args.outputs.repo_owner }}" ]; then
            CMD="$CMD --repo-owner ${{ steps.args.outputs.repo_owner }}"
          fi
          if [ -n "${{ steps.args.outputs.upgrade_channel }}" ]; then
            CMD="$CMD --upgrade-channel ${{ steps.args.outputs.upgrade_channel }}"
          fi

          echo "Running: $CMD"
          eval "$CMD"

      # NOTE: Telegraf log forwarding to Elasticsearch is temporarily disabled.
      # The ES cluster has been decommissioned and will return later.
      # The provisioning code and tests are retained in deploy/ for when it's re-enabled.
      # To re-enable, uncomment the step below and ensure the ES secrets are configured.
