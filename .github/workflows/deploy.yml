name: Deploy to DigitalOcean

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject secrets into app spec
        env:
          FLASK_SECRET_KEY: ${{ secrets.DO_FLASK_SECRET_KEY }}
          WORKFLOW_RUNNER_PAT: ${{ secrets.DO_WORKFLOW_RUNNER_PAT }}
          GITHUB_CLIENT_ID: ${{ secrets.DO_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.DO_GITHUB_CLIENT_SECRET }}
        run: |
          yq -i '(.services[0].envs[] | select(.key == "FLASK_SECRET_KEY")).value = strenv(FLASK_SECRET_KEY)' app.yaml
          yq -i '(.services[0].envs[] | select(.key == "WORKFLOW_RUNNER_PAT")).value = strenv(WORKFLOW_RUNNER_PAT)' app.yaml
          yq -i '(.services[0].envs[] | select(.key == "GITHUB_CLIENT_ID")).value = strenv(GITHUB_CLIENT_ID)' app.yaml
          yq -i '(.services[0].envs[] | select(.key == "GITHUB_CLIENT_SECRET")).value = strenv(GITHUB_CLIENT_SECRET)' app.yaml
          yq -i '(.workers[0].envs[] | select(.key == "WORKFLOW_RUNNER_PAT")).value = strenv(WORKFLOW_RUNNER_PAT)' app.yaml
      - uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.ANT_DEPLOY_DO_APP_TOKEN }}
          app_spec_location: app.yaml
