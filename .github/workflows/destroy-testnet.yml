name: Destroy Network

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Name of the deployment to destroy"
        required: true
        type: string

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      DO_TOKEN: ${{ secrets.SAORSA_DEPLOY_DO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SAORSA_DEPLOY_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SAORSA_DEPLOY_AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install saorsa-deploy
        run: pip install git+https://github.com/maidsafe/saorsa-deploy.git

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SAORSA_DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Run saorsa-deploy destroy
        run: saorsa-deploy destroy --name ${{ inputs.name }}
