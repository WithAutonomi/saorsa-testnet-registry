[tool.uv.workspace]
members = ["db", "web", "mcp", "deploy"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
# Use importlib to avoid namespace collisions between deploy/tests and web/tests
addopts = "--import-mode=importlib"
