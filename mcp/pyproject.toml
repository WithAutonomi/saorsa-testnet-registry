[project]
name = "saorsa-deploy-mcp"
version = "1.5.0"
description = "MCP server for the Saorsa Testnet Registry"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.2",
    "python-dotenv>=1.1",
    "saorsa-db",
]

[tool.uv.sources]
saorsa-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saorsa_deploy_mcp"]
