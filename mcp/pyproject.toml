[project]
name = "saorsa-deploy-mcp"
version = "0.1.6"
description = "MCP server for the Saorsa Testnet Registry"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.2",
    "httpx>=0.28",
    "python-dotenv>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saorsa_deploy_mcp"]
