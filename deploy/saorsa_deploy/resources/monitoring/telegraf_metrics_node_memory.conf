###############################################################################
#                  PER-PROCESS MEMORY COMPOSITION (node tier)                 #
###############################################################################
#
# Appended to the base metrics config only when node-memory collection is
# enabled, so every other deployment's TOML stays byte-identical.
#
# The existing `[[inputs.procstat]]` blocks already record aggregate RSS
# (`procstat.memory_rss`). That cannot separate anonymous/heap memory from
# file-backed or shared resident pages -- which matters here because an
# ant-node's file-backed RSS is largely the LMDB chunk-store mmap, so a growing
# `memory_rss` can be a growing chunk store rather than a leak. These two inputs
# add that breakdown as a separate `ant_node_memory` measurement; the procstat
# series and tags are untouched.
#
# Two inputs rather than one because the two sources differ in cost by ~90x:
#
#   /proc/<pid>/status        ~1 ms per process
#   /proc/<pid>/smaps_rollup  ~105 ms per process
#
# (measured on a production node). The rollup is expensive because the kernel
# walks page tables across the whole 39-80 GB virtual address space -- the
# sparse LMDB map -- not merely the ~65 VMAs, and it holds the target's
# mmap_lock read-side throughout. So the cheap source runs at 30s and the
# costly one at 60s. At 60s the rollup costs ~2.3% of one core on a 13-service
# host.
#
# `timeout` bounds each scrape at the Telegraf end so a slow host cannot let
# scrapes stack up; the collector also bounds itself via --deadline-secs. Both
# are set below the input's own interval on purpose.

[[inputs.exec]]
  commands = ["{{COLLECTOR_PATH}} --source status --deadline-secs 20"]
  interval = "30s"
  timeout = "25s"
  data_format = "influx"

[[inputs.exec]]
  commands = ["{{COLLECTOR_PATH}} --source rollup --deadline-secs 45"]
  interval = "60s"
  timeout = "50s"
  data_format = "influx"
