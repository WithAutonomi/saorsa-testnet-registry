###############################################################################
#              PER-PROCESS MEMORY COMPOSITION — mmap tier (node)              #
###############################################################################
#
# Appended to the base metrics config only when node-memory collection is
# enabled, so every other deployment's TOML stays byte-identical.
#
# The base config's `[[inputs.procstat]]` blocks collect `properties =
# ["cpu", "memory", "limits"]` at the 10s agent interval -- deliberately WITHOUT
# "mmap". These blocks re-declare the same process sets with `properties =
# ["mmap"]` alone, at 60s, which is what adds the smaps-derived composition:
# memory_pss, memory_anonymous, memory_private_clean/dirty,
# memory_shared_clean/dirty, memory_referenced, memory_swap.
#
# Two tiers rather than one because the mmap property is ~45x the cost of the
# rest. Measured on a production node (13 services): procstat with mmap at the
# 10s agent interval costs 6.78% of one core, at 60s costs 1.15%, and without
# mmap costs 0.15%. Splitting keeps the cheap CPU/memory/FD/thread telemetry at
# its existing 10s resolution while paying the mmap cost only once a minute.
# Telegraf's own docs flag this property: "caution: can cause high load".
#
# No `prefix` is set. The two tiers emit disjoint field sets into the same
# `procstat` measurement with the same tag set, and InfluxDB merges points that
# share a series and timestamp when their fields do not overlap (verified
# against the production instance). So the fields simply land side by side.
#
# Requires CAP_SYS_PTRACE on the telegraf unit: /proc/<pid>/smaps is gated on
# ptrace_may_access against the target, not on file permissions, so an
# unprivileged telegraf silently collects nothing here. CAP_PERFMON was tested
# on the production kernel (6.8.0-86) and is NOT sufficient -- 0 of 13
# processes readable, identical to no capability at all.

[[inputs.procstat]]
  cgroup = "system.slice/ant-node-*.service"
  properties = ["mmap"]
  interval = "60s"

[[inputs.procstat]]
  cgroup = "system.slice/ant-bootstrap-*.service"
  properties = ["mmap"]
  interval = "60s"

[[inputs.procstat]]
  cgroup = "system.slice/ant-bootstrap.service"
  properties = ["mmap"]
  interval = "60s"

[[inputs.procstat]]
  cgroup = "system.slice/ant-genesis-node.service"
  properties = ["mmap"]
  interval = "60s"
