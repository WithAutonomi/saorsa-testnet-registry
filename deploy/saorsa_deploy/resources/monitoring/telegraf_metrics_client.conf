###############################################################################
#         CLIENT SERVICE MEMORY (uploader / downloader / canary)              #
###############################################################################
# Appended ONLY on CLIENT-role hosts. The node procstat globs in the base config
# (ant-node-*, ant-bootstrap*, ant-genesis-node) never match a client box, so the
# client `ant` process's memory was previously unrecorded. These two inputs land
# per-process RSS and whole-service memory into the client-metrics bucket.
#
# A single `ant-*.service` glob is exact on a client VM: the only `ant-*` units
# there are the client service(s) -- ant-uploader, ant-downloader,
# ant-prod-uploader, ant-prod-downloader, ant-prod-canary-upload,
# ant-prod-canary-probe. `telegraf-*` units don't match the `ant-*` prefix, and
# nodes never run on a client box. A glob that matches nothing emits no error,
# so this is quiet whichever single client kind a given VM runs.

# Per-process metrics (RSS, CPU, threads, fds). The cgroup is re-resolved every
# interval (reads cgroup.procs) so each new short-lived upload PID is picked up
# automatically. Series are keyed by process_name (ant / python3) -- NOT pid --
# so PID churn across uploads does not fragment the series: one continuous
# `memory_rss` line per name, with gaps between uploads. The finer 2s interval
# (vs the 10s agent default) captures the pre-OOM ramp. The base config's regex
# processor (namepass=["procstat"]) tags these with `node_service` from the
# resolved cgroup path (e.g. node_service="ant-prod-uploader").
[[inputs.procstat]]
  cgroup = "system.slice/ant-*.service"
  interval = "2s"
  [inputs.procstat.tags]
    metric_source = "ant-client"

# Whole-service cgroup memory (PID-agnostic, catches spikes). memory.current is
# the live usage; memory.peak is the high-water mark since the unit last
# (re)started -- it records the true peak even between scrapes, so a sub-2s
# terminal spike that the discretely-sampled procstat RSS clips is still caught.
# This is the same number `systemctl status` reports.
[[inputs.cgroup]]
  paths = ["/sys/fs/cgroup/system.slice/ant-*.service"]
  files = ["memory.current", "memory.peak"]
  interval = "2s"
