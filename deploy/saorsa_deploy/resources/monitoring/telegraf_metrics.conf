###############################################################################
#                            GLOBAL TAGS                                      #
###############################################################################

[global_tags]
  testnet_name = "${ANT_TESTNET_NAME}"
  host_role = "${ANT_HOST_ROLE}"

###############################################################################
#                            AGENT                                            #
###############################################################################

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 200000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = ""
  omit_hostname = false

###############################################################################
#                            INPUTS                                           #
###############################################################################

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# --- Per-device disk I/O (throughput, IOPS, latency) ------------------------
# `inputs.disk` above is capacity only (used/free/total); this is the traffic.
# Emits monotonic counters -- read_bytes/write_bytes, reads/writes, read_time/
# write_time, io_time, weighted_io_time -- plus the gauge iops_in_progress, all
# tagged with the device `name` (e.g. "sdb"). Throughput, IOPS, await and %util
# are all derivable from these, so nothing else is needed.
#
# `devices` is an INCLUDE-only glob list -- the plugin has no exclude option --
# so the list must name every device pattern we care about. It covers each
# provider's naming (DigitalOcean vda/sda, OVH + Hetzner sda/sdb, Vultr
# vda/vdb, Contabo root-only, NVMe) plus LVM dm-* for the hosts whose data
# volume is LVM-backed rather than raw ext4. Crucially it does NOT match
# `loop*`: Ubuntu cloud images carry ~10 snapd loop devices that would
# otherwise add that many permanently-zero series to every host.
#
# The device `name` tag carries no mountpoint, so the node storage volume is
# identified instead by the `volume_role` tag applied by the processor below.
[[inputs.diskio]]
  devices = ["sd*", "vd*", "nvme*", "xvd*", "dm-*"]
  # Keep disk serial numbers out of the tag set (cardinality).
  skip_serial_number = true

[[inputs.net]]
  ignore_protocol_stats = true

# --- Per-process metrics (RSS, CPU, threads, fds) ---------------------------
# Read straight from /proc via each service's systemd cgroup. This does NOT
# depend on the node exposing a metrics endpoint, and auto-discovers services
# by cgroup glob, so it works regardless of how many nodes a host runs
# (node_count is not needed). Each match is tagged with its cgroup path; the
# regex processor below turns that into a clean `node_service` tag
# (e.g. "ant-node-3") so RSS lines up with the per-node tag the dashboards
# already use.
[[inputs.procstat]]
  cgroup = "system.slice/ant-node-*.service"

[[inputs.procstat]]
  cgroup = "system.slice/ant-bootstrap-*.service"

# Production bootstraps run a single un-indexed `ant-bootstrap.service`,
# which the `ant-bootstrap-*` glob above does NOT match (it requires a
# trailing hyphen). A glob that matches nothing is harmless on other hosts.
[[inputs.procstat]]
  cgroup = "system.slice/ant-bootstrap.service"

[[inputs.procstat]]
  cgroup = "system.slice/ant-genesis-node.service"

###############################################################################
#                            PROCESSORS                                       #
###############################################################################

# Derive `node_service` (e.g. "ant-node-3") from the resolved per-service
# cgroup path procstat attaches as `cgroup_full`
# (e.g. "/sys/fs/cgroup/system.slice/ant-node-3.service"). NB: the `cgroup`
# tag holds the literal glob, so it must be `cgroup_full` here. Single-quoted
# TOML literal so the regex backslash is preserved.
[[processors.regex]]
  namepass = ["procstat"]
  [[processors.regex.tags]]
    key = "cgroup_full"
    pattern = '^.*/(.+)\.service$'
    replacement = "${1}"
    result_key = "node_service"

# Mark the node storage volume's device with `volume_role = "node-storage"`.
#
# diskio only knows kernel device names (sdb, dm-0), never mountpoints, and the
# device backing /mnt/ant-node-storage differs by provider and by whether the
# volume is raw ext4 or LVM-striped. So the device is resolved ON THE HOST at
# provision time (findmnt -> lsblk KNAME, same idiom as set_reserved_blocks.py)
# and written to ANT_DATA_DEVICE in /etc/default/telegraf-ant-metrics; Telegraf
# substitutes it into the pattern below. On root-disk hosts (Contabo, OVH 3-AZ)
# node data lives on the OS root filesystem, so the root device is resolved
# instead -- that series then covers OS I/O as well, which is unavoidable there.
#
# When a host has no node storage at all (client VMs), ANT_DATA_DEVICE is the
# sentinel `__none__`, which matches no real device, so nothing is tagged.
#
# Consumers must test `volume_role == "node-storage"` rather than merely
# testing for the tag's presence: the regex processor leaves non-matching
# metrics alone, but treating any value as the storage volume would silently
# mislabel every device if that ever changed.
[[processors.regex]]
  namepass = ["diskio"]
  [[processors.regex.tags]]
    key = "name"
    pattern = "^${ANT_DATA_DEVICE}$"
    replacement = "node-storage"
    result_key = "volume_role"

###############################################################################
#                            OUTPUT                                           #
###############################################################################

[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
