# Connection-error log strings counted on every staging run (V2-842).
#
# These are CONFIG, not code, for the same reason the gate thresholds are: the
# strings are emitted by saorsa-core / saorsa-transport / ant-node and change
# when those crates change. Adding, retiring or re-wording one must not require
# a release of saorsa-deploy.
#
# `version` is stored on every recorded count. Counts captured under different
# pattern versions are only comparable if the pattern itself did not change --
# the version is what tells you to check.
#
# v2 (2026-09-02, V2-1091): retired two patterns that could not fire -- see
# "Retired patterns" at the foot of this file -- and corrected two `module:`
# fields that had been transposed. Counts for the four surviving patterns are
# unaffected: no phrase changed, so v1 and v2 counts of them ARE comparable.
# The two retired keys simply stop being recorded.
#
# v3 (2026-09-26, V2-1339): ADDED the pointer groups. Nothing existing changed,
# so v2 and v3 counts of the connection groups ARE comparable. Every run
# recorded before v3 has no pointer counts at all, which the comparison reports
# as NOT ASSESSED rather than as zero -- a zero against a run that had no
# pointer clients would read as a perfect result.
#
# v4 (2026-10-03, V2-1413): ADDED the subtree storage-audit failure group and
# the commitment-rotation group, for the V2-1363 pointer A/B. Nothing existing
# changed, so v3 and v4 counts of every pre-existing key ARE comparable -- it is
# only the NEW keys that the four prior pointer runs (612/614/615/627) have no
# counts for, which the comparison reports as NOT ASSESSED.
#
# v5 (2026-10-06, V2-1441): ADDED the payment-RPC failure group, the first
# ADVISORY group. It measures the environment the run happened in -- whether
# the public Arbitrum Sepolia RPC was rate-limiting the nodes' payment
# verification -- not the release, so it is reported beside the gates it
# confounds and never counted in the verdict. Added because the V2-1359 A/B
# (runs 635/639/650) read a 41-46% upload-duration regression that the raw logs
# attributed to ~8,900 HTTP 429s an hour from that endpoint, and nothing in the
# recorded run said so. Nothing existing changed, so v4 and v5 counts of every
# pre-existing key ARE comparable; runs before v5 have no payment-RPC counts,
# which the comparison reports as NOT ASSESSED (advisory).
version: 5

# ---------------------------------------------------------------------------
# Verification.
#
# Every phrase below was confirmed to be a reachable emit in the pinned source
# on 2026-09-02, against:
#
#   saorsa-core       upstream/main @ f0e1e88 (v0.27.3; identical on
#                     rc-2026.9.1 and rc-2026.8.4 for every phrase here)
#   saorsa-transport  0.36.3 (pinned by that saorsa-core)
#
# Worth repeating whenever a gate starts reading zero. V2-1091 found one
# pattern that had counted real lines for months and then went silent because
# an upstream refactor removed the failure it watched -- from Elasticsearch
# alone that is indistinguishable from a healthy network.

# ---------------------------------------------------------------------------
# Which forwarded logs are counted.
#
# `nodes` means the node-tier index `telegraf-ant-nodes-<name>-*`. Client logs
# go to a SEPARATE index (`telegraf-ant-clients-<name>`) with a different
# document shape -- raw stderr lines under `message`, not structured fields
# under `tail` -- so pooling the two would compare unlike things and would also
# silently vary with whether the run enabled client `forward_logs` at all.
#
# Consequence worth stating plainly: these are NODE-side counts. A connection
# error the client saw and the nodes did not is not in this measurement.
index_scope: nodes

# ---------------------------------------------------------------------------
# Groups.
#
# The comparison gates on the GROUP, never on an individual pattern. A group
# exists so that one phenomenon logged at more than one layer produces one
# gate rather than several that all move together and read as independent
# corroborating evidence.
#
# `aggregate` says how a group's member counts combine:
#   max -- the members are the SAME event seen at different layers. Their counts
#          should track each other; the larger is the better estimate of how
#          often the phenomenon occurred, and summing would double-count it.
#   sum -- the members are genuinely distinct events that belong to one gate.
groups:
  - key: connection_failure
    label: Connection failures
    aggregate: max
    # Measured across the DEV-02 comparison: 1,415 / 1,415 on the baseline and
    # 71,309 / 71,160 on the branch -- the two counts tracked each other to
    # within 0.2% at both ends of a 50x swing. They are near-certainly one
    # event logged at the core and transport layers, so they are one gate.
    note: >-
      `Connection attempt failed` and `connect_happy_eyeballs failed` are the
      same failure logged at two layers.

  - key: dial_failure
    label: Dial failures (all candidates)
    aggregate: sum

  - key: identity_announce_failure
    label: Identity announce failures
    aggregate: sum

  # -------------------------------------------------------------------------
  # Pointer groups (V2-1339). Every phrase below was read off ant-node branch
  # `feat/pointers-immutable-owner` and confirmed to be a reachable WARN or INFO
  # emit on 2026-09-26. They are NODE-side counts: what the client saw is in
  # `deployment_pointer_records`, and the two are deliberately separate -- "the
  # client was served a stale state" and "a node refused to store one" are
  # different facts, and telling them apart is the point.
  #
  # Nothing here counts the ordinary stale refusal or the quorum shortfall: on
  # this branch both are DEBUG, and the node-tier forwarder drops DEBUG at
  # `log_level: info`, which is what staging runs at. They would read zero for a
  # reason that has nothing to do with pointers. Promoting them is a request on
  # V2-1277.
  - key: pointer_store_failure
    label: Pointer store failures (node)
    aggregate: sum
    # Distinct events, not one thing logged twice: a replicated pointer and a
    # freshly-paid one arrive by different paths, and a commit failure is the
    # write not reaching disk. Summing them gives "stores that did not happen".
    note: >-
      Replication stores, fresh paid stores and commits are separate failures
      that all mean a pointer a node should hold, it does not.

  - key: pointer_address_collision
    label: Pointer/chunk address collisions (node)
    aggregate: sum
    # An address cannot hold both kinds, so these two are the same rule refusing
    # in either direction -- but they are genuinely different events (one refuses
    # a pointer, the other a chunk) and both are interesting, so they sum.
    note: >-
      A pointer refused because a chunk holds its address, or a chunk refused
      because a pointer does. Expected to be zero: an address is derived from
      the owner key, so a collision is a hash collision or a bug.

  - key: pointer_replication_shortfall
    label: Pointer replication shortfalls (node)
    aggregate: sum
    note: >-
      A peer that was offered a pointer and does not hold it, or a prune that
      failed. The offer side is the one to watch during a mixed-version run: a
      pre-pointer node cannot decode the message at all.

  - key: pointer_audit_failure
    label: Pointer subtree-audit failures (node)
    aggregate: sum
    note: >-
      A pointer this node committed to holding that the audit cannot read back.
      The subtree-audit protocol id bumps to v2 for pointers, so old and new
      nodes stop auditing each other during a rollout.

  - key: pointer_prune
    label: Pointer records pruned (node)
    aggregate: sum
    # INFO, and not a failure: a node that is no longer responsible for a
    # pointer is supposed to drop it. Counted because a run where this figure
    # explodes is a run where responsibility is churning, and the pointer read
    # rates would fall for that reason rather than for a pointer-specific one.
    note: >-
      Not a fault -- dropping a pointer a node is no longer responsible for is
      correct. Counted so churn can be told apart from a pointer regression.

  # -------------------------------------------------------------------------
  # Subtree storage-audit groups (V2-1413). Both pinned against ant-node
  # `v0.21.0` and read off the source on 2026-10-03. If a later ant-node renames
  # either emit these read ZERO, and a zero phrase count never distinguishes
  # "did not happen" from "the string was renamed" -- confirm against the pinned
  # source before reporting a zero as an improvement.
  - key: subtree_audit_failure
    label: Subtree storage-audit failures (node)
    aggregate: sum
    # All five members are the SAME auditor-side WARN
    # (`src/replication/storage_commitment_audit.rs:1184`,
    # `warn!("Audit: {challenged_peer} failed subtree audit ({reason:?})")`)
    # discriminated by the `AuditFailureReason` Debug rendering. They sum
    # because each is a distinct failure of a distinct audit, and every variant
    # in `src/replication/types.rs:356-367` has a pattern, so the group total is
    # the TRUE total and no failure is silently uncounted.
    #
    # Deliberately NOT added, because each would read as a false zero:
    # ant-node #238's `reason="pointer_binding_budget"` rides on the existing
    # "Audit responder admission dropped" message, whose phrase also matches the
    # pre-existing heavy-pool cooldown / work-budget drops, so a phrase count
    # cannot discriminate them; and its round-2 "cannot serve the record round 1
    # read for pointer" reaches the auditor only inside a `debug!`, which the
    # node-tier forwarder drops at `log_level: info`. Both of #238's regression
    # modes surface here instead as `subtree_audit_fail_timeout` rising, because
    # `RejectKind::Transient` grades into the timeout lane (`grade_reject` ->
    # `RejectGrade::TimeoutLane` -> `AuditFailureReason::Timeout`).
    note: >-
      Every confirmed subtree-audit failure the auditor charged, by reason.
      `DigestMismatch` is the one the V2-1363 A/B turns on: a pointer updated
      twice between audit round 1 and round 2 charges an honest holder.

  - key: storage_commitment_rotated
    label: Storage commitment rotations (node)
    aggregate: sum
    # INFO, and not a failure: rotating the commitment is the normal cycle. It
    # is the only info-level evidence that pointer leaves are being committed at
    # all -- a successful round-2 pointer opening has no info-level line
    # anywhere in v0.21.0 -- which is what makes a clean audit-failure count
    # falsifiable rather than indistinguishable from an audit that never opened
    # a pointer leaf. `analysis pointer-commitments` splits these by whether the
    # line reports `pointers=0`, which this phrase count cannot.
    note: >-
      Not a fault. The denominator-ish companion to the audit failures: it says
      commitments were rotating, so a zero failure count means something.

  # -------------------------------------------------------------------------
  # Payment RPC (V2-1441). ADVISORY: this group is about the environment, not
  # the release. Every node verifies every paid PUT against the payment vault
  # over an EVM JSON-RPC endpoint, and on a testnet that endpoint is the
  # anonymous public Arbitrum Sepolia one (`--evm-network arbitrum-sepolia`,
  # `https://sepolia-rollup.arbitrum.io/rpc`), shared by every node process in
  # the fleet and by everyone else on the internet using it that hour. When it
  # rate-limits, the node rejects the PUT with `payment failed`, the client
  # retries the chunk, and every upload gets slower -- uniformly, across
  # uploaders, sizes and payment modes, which is the signature to look for.
  #
  # Measured on the V2-1359 A/B candidate (run 650, 2026-10-06, daytime):
  # 4,004 / 1,584 / 2,608 / 1,148 / 3,602 node-side 429 lines per hour from T0,
  # on all 14 node VMs, while uploads ran 41-46% slower at the median than a
  # reference that ran overnight. That is why the group exists: so the figure
  # is recorded with the run and the next duration regression is read against
  # it rather than discovered in Elasticsearch after the reference's logs are
  # gone.
  #
  # Advisory because a FAIL here would blame the release for the weather. The
  # comparison still renders the row, marked advisory, and repeats `confounds`
  # as a warning at the top of the report when the candidate's per-hour rate is
  # well above the baseline's.
  - key: payment_rpc_failure
    label: Payment RPC failures (node)
    aggregate: max
    advisory: true
    confounds: >-
      the native upload-duration (p50/p95) and upload-success gates: a PUT
      rejected for a payment-verification RPC failure is retried by the client,
      so uploads slow down for a reason that has nothing to do with the release
    # Both members are the SAME event -- one failed `completedPayments` call --
    # seen in two renderings: the lookup wrapper names the call, the HTTP
    # status names the cause. Any one line carries both when the cause is a
    # 429, so summing would double-count; the lookup count is the larger and is
    # the better estimate of "how often did verification fail at the RPC", the
    # 429 count is how much of that was rate limiting.
    note: >-
      Payment verification could not reach or was refused by the EVM RPC
      endpoint. Environmental: the public Sepolia endpoint is shared with the
      world. A rise here is a reason to doubt the upload-duration gates, not a
      finding about the release.

# ---------------------------------------------------------------------------
# Patterns.
#
# `phrase` is matched with an Elasticsearch `match_phrase` against
# `tail.message`. Two consequences to keep in mind when editing:
#
# 1. It must be a STABLE SUBSTRING, never the paraphrase written in an issue.
#    The dial-failure emit is `[STEP 1b] {} -> {}: dial failed for all {}
#    candidate address(es)` -- it interpolates a peer, an address and a count,
#    so any phrase spanning them matches nothing, forever, and reports zero.
# 2. `tail.message` is an analysed field, so matching is case-insensitive and
#    ignores punctuation. `Accept stream error: connection failed` matches a
#    line that writes those words with different separators. That is deliberate
#    -- it survives cosmetic re-wording -- but it does mean a phrase must be
#    distinctive in its WORDS, not in its punctuation.
#
# A pattern whose count is zero is NOT self-explaining: "the string is gone
# because the bug is fixed" and "the string was renamed" are indistinguishable
# from Elasticsearch alone. Confirm a zero against the pinned source before
# reporting it as an improvement.
#
# V2-1091 added a third possibility, and it is the one that hides longest: the
# emit is still there, spelled exactly as catalogued, but the branch it sits on
# can no longer execute. Checking that the phrase still appears in the source
# is NOT enough -- check that something can still reach it.
patterns:
  # These two `module:` fields were transposed until v2 -- each carried the
  # other's. Corrected 2026-09-02 against the pinned source; a wrong module
  # sends the next person verifying a zero into the wrong crate, which is
  # exactly how V2-1091's investigation lost time.
  - key: connection_attempt_failed
    group: connection_failure
    # One per ADDRESS attempt inside the happy-eyeballs race, so this side can
    # only ever be >= the saorsa_core one below. That is why the group takes
    # the max rather than the sum.
    phrase: "Connection attempt failed"
    module: saorsa_transport::happy_eyeballs

  - key: happy_eyeballs_failed
    group: connection_failure
    # One per OVERALL happy-eyeballs failure, logged by the caller.
    phrase: "connect_happy_eyeballs failed"
    module: saorsa_core::transport_handle

  - key: dial_failed_all_candidates
    group: dial_failure
    # The stable prefix only: the emit interpolates a candidate count.
    phrase: "dial failed for all"
    module: saorsa_core::dht_network_manager

  - key: identity_announce_failed
    group: identity_announce_failure
    phrase: "Failed to send identity announce"
    module: saorsa_core::transport_handle

  # --- pointers (V2-1339) --------------------------------------------------
  # Stable substrings only. Every one of these emits interpolates a hex address
  # and most also an error, so a phrase spanning them would match nothing.
  - key: pointer_replicated_store_failed
    group: pointer_store_failure
    phrase: "Could not store replicated pointer"
    module: ant_node::replication::pointer

  - key: pointer_fresh_store_failed
    group: pointer_store_failure
    phrase: "Could not store fresh pointer"
    module: ant_node::replication::pointer

  - key: pointer_commit_failed
    group: pointer_store_failure
    phrase: "Pointer commit failed"
    module: ant_node::pointer::service

  - key: pointer_refused_chunk_holds_address
    group: pointer_address_collision
    # "Refusing pointer at {}: a chunk already occupies that address" -- the
    # address sits between the two halves, so only the tail is usable.
    phrase: "a chunk already occupies that address"
    module: ant_node::pointer::service

  - key: chunk_refused_pointer_holds_address
    group: pointer_address_collision
    phrase: "a pointer already occupies that address"
    module: ant_node::storage::handler

  - key: pointer_offer_not_held
    group: pointer_replication_shortfall
    # "Peer {peer} does not hold pointer {} it was offered".
    phrase: "does not hold pointer"
    module: ant_node::replication::pointer

  - key: pointer_prune_failed
    group: pointer_replication_shortfall
    phrase: "Could not prune pointer"
    module: ant_node::replication::pointer

  - key: pointer_audit_not_held
    group: pointer_audit_failure
    phrase: "committed pointer"
    # Matches both "Subtree audit: committed pointer {key} is not held" and
    # "Subtree audit: read error for committed pointer {key}", which is
    # deliberate: both mean the audit could not confirm a pointer this node
    # committed to. A phrase spanning the "is not held" tail would miss the
    # read-error case entirely, and the two are the same finding.
    module: ant_node::replication::storage_commitment_audit

  - key: pointer_records_pruned
    group: pointer_prune
    # "Pruned {deleted} pointer records this node is no longer responsible for"
    # -- the count is interpolated, so the phrase starts after it.
    phrase: "pointer records this node is no longer responsible for"
    module: ant_node::replication::pointer

  # --- subtree storage audit (V2-1413) ------------------------------------
  # One WARN, five reasons. `tail.message` is analysed, so the match is case-
  # and punctuation-insensitive -- but the parenthesised reason still
  # discriminates, because the reason token is distinct per variant and
  # `match_phrase` requires the tokens adjacent and in order.
  - key: subtree_audit_fail_digest_mismatch
    group: subtree_audit_failure
    phrase: "failed subtree audit (DigestMismatch)"
    module: ant_node::replication::storage_commitment_audit

  - key: subtree_audit_fail_key_absent
    group: subtree_audit_failure
    phrase: "failed subtree audit (KeyAbsent)"
    module: ant_node::replication::storage_commitment_audit

  - key: subtree_audit_fail_timeout
    group: subtree_audit_failure
    phrase: "failed subtree audit (Timeout)"
    module: ant_node::replication::storage_commitment_audit

  - key: subtree_audit_fail_rejected
    group: subtree_audit_failure
    phrase: "failed subtree audit (Rejected)"
    module: ant_node::replication::storage_commitment_audit

  - key: subtree_audit_fail_malformed
    group: subtree_audit_failure
    phrase: "failed subtree audit (MalformedResponse)"
    module: ant_node::replication::storage_commitment_audit

  - key: storage_commitment_rotated
    group: storage_commitment_rotated
    # "Storage commitment rotated: hash={hash} key_count={key_count}
    # pointers={pointer_count}" -- the whole line is one unparsed
    # `tail.message`; `hash=`, `key_count=` and `pointers=` are NOT fields, so
    # telling `pointers=0` from `pointers=7` needs a wildcard on
    # `tail.message.keyword`, which `match_phrase` cannot express. That is what
    # `analysis pointer-commitments` is for.
    phrase: "Storage commitment rotated"
    module: ant_node::replication

  # --- payment RPC (V2-1441) ----------------------------------------------
  # Both ride ant-node's `warn!(target: "ant_node::payment::verify", "Slow
  # payment verification failed: context={..}, proof_type={..},
  # proof_bytes={..}, elapsed_ms={..}: {e}")` (`src/payment/verifier.rs`, at
  # v0.21.0), where `{e}` is the verifier's error chain. A verification that
  # fails FAST (< 500 ms, `PAYMENT_VERIFY_SLOW_LOG_MS`) is logged at DEBUG,
  # which the node-tier forwarder drops at `log_level: info`, so these counts
  # are a LOWER BOUND on RPC failures. A 429 after the HTTP client's retries is
  # never fast, so in practice the rate-limited case is counted.
  - key: payment_rpc_http_429
    group: payment_rpc_failure
    # `completedPayments lookup failed: HTTP error 429 with body: {...}`. The
    # body is the provider's text ("Too Many Requests", "Rate Limit Hit", ...)
    # and varies between endpoints; the status code does not. Stable substring
    # only: `tail.message` is analysed, so the three tokens match in order.
    phrase: "HTTP error 429"
    module: ant_node::payment::verify

  - key: completed_payments_lookup_failed
    group: payment_rpc_failure
    # `Error::Payment(format!("completedPayments lookup failed: {e}"))` in
    # `PaymentVerifier` -- every failure of the vault lookup, whatever the
    # cause (429, 5xx, timeout, connection refused). The superset of the 429s.
    phrase: "completedPayments lookup failed"
    module: ant_node::payment::verify

# ---------------------------------------------------------------------------
# Retired patterns.
#
# Kept as prose, deliberately: both look like obvious gaps in the coverage and
# would be re-added by anyone who did not know why they went. Each was retired
# because the code that emits it CANNOT RUN -- not because the error stopped
# being interesting.
#
# Both retired at v2 (2026-09-02, V2-1091), after counting zero on every run
# that has ever recorded these counts (deployments 513, 532, 538, 544).
#
# ---------------------------------------------------------------------------
# `accept_stream_connection_not_found` -- group `accept_stream_failure`
#     phrase: "Accept stream error: connection failed: Connection not found"
#
# This one was RIGHT, and the failure it watched has since been fixed.
#
# The phrase was transcribed from a real log line: under saorsa-transport
# 0.35.3, `LinkTransport::accept()` accepted a peer and then looked the
# connection up again by address, and an `Ok(None)` miss yielded
# `LinkError::ConnectionFailed("Connection not found")`. Rendered through
# saorsa-core's `warn!("Accept stream error: {}", e)` that produced the
# catalogued phrase character for character. It last matched on DEV-02 run 502
# (2 hosts of 72, during service restarts).
#
# saorsa-transport 0.36.0 rewrote the path onto `accept_with_connection()`,
# which keeps the authoritative accepted handle. Its doc comment gives the
# reason: looking the connection up again "races connection cleanup when a
# short-lived peer closes immediately after the handshake" -- precisely the
# restart-time race the counts had been showing. From 0.36.0 the accept stream
# yields only `Ok`, so saorsa-core's `Err(e)` arm is unreachable and the phrase
# cannot be emitted at all.
#
# Note this is why WIDENING the phrase (to the stable prefix "Accept stream
# error") does not help: the emit itself is unreachable, so any phrase over it
# still counts zero.
#
# If you want accept-path coverage again, the reachable candidate is
# saorsa-transport's `error!("Failed to spawn connection handler: {}", e)`
# (p2p_endpoint.rs, ERROR, does reach Elasticsearch). It counts a DIFFERENT
# failure, so it needs its own key and label rather than reusing these.
# Its sibling `debug!("Accept failed: {}", e)` is DEBUG and is dropped by the
# node telegraf filter at `log_level: info`, so it would read zero for a
# second, unrelated reason.
#
# ---------------------------------------------------------------------------
# `quic_disconnect` -- group `quic_disconnect`
#     phrase: "QUIC disconnect for peer"
#
# This one was never alive at any version we can inspect.
#
# The phrase is a correct, stable prefix of saorsa-core's
# `warn!("QUIC disconnect for peer {}: {}", addr, e)`, but that arm is dead
# code. `P2pEndpoint::disconnect()` is total and returns exactly `Ok(())` or
# `EndpointError::PeerNotFound` -- in 0.35.3, 0.36.0 and 0.36.3 alike -- and
# the two arms above it consume both outcomes:
#
#     Ok(()) => {}
#     Err(EndpointError::PeerNotFound(_)) => { debug!(...) }
#     Err(e) => warn!("QUIC disconnect for peer {}: {}", addr, e)   // dead
#
# Its `module:` was `saorsa_transport_adapter.rs:626` -- a file:line rather
# than a module path, the signature of an entry transcribed by reading code
# rather than from an observed log line. That is the tell to watch for.
#
# There is no replacement: saorsa-transport's `p2p_endpoint.rs` has no
# WARN- or ERROR-level disconnect or cleanup emit at 0.36.3, and saorsa-core
# has none besides the dead arm itself.
