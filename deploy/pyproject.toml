[project]
name = "saorsa-deploy"
version = "1.1.0"
description = "Deploy testnets for ant-node using Terraform and Pyinfra"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.34",
    "eth-account>=0.13",
    "pydantic>=2",
    "pyinfra>=3",
    "pyyaml>=6",
    "requests>=2",
    "rich>=13",
    "saorsa-db",
    "web3>=7",
]

[project.scripts]
saorsa-deploy = "saorsa_deploy.main:main"

[tool.uv.sources]
saorsa-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatchling honours only the ROOT .gitignore, and `node_modules/` is ignored by
# `saorsa_deploy/resources/wasm-client/.gitignore` alone — so a wheel built from
# an operator's tree that has ever run `build ant-wasm-check` swept in 12,478
# node_modules entries and came to 23.7 MB against 1.3 MB clean. The canary
# publisher installs this wheel on a VM, so without this the VM would run
# whatever happens to be on the operator's disk rather than the tree.
[tool.hatch.build.targets.wheel]
packages = ["saorsa_deploy"]
exclude = [
    "saorsa_deploy/resources/wasm-client/node_modules",
    "saorsa_deploy/resources/wasm-client/dist",
    # Same trap, same reason: `resources/browser-client/.gitignore` is a nested
    # one, so its `node_modules/` is invisible to hatchling. The browser
    # harness's dependency is Playwright, which is larger again.
    "saorsa_deploy/resources/browser-client/node_modules",
    "**/.terraform",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
