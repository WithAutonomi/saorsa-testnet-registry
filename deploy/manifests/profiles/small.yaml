# Small base profile: ~100-node testnet with a couple of 10 MB uploaders.
#
# Like staging-rc.yaml, this is a base profile (no name/purpose/binaries) — a run
# `extends:` it and supplies those. Monitoring (InfluxDB + Grafana) is ON by default,
# so client upload/download metrics are captured; no monitoring block is needed here.
# Elastic log-forwarding stays opt-in — add an `elastic:` block to enable it.
#
# Node math: 100 ant-node services = 20 VMs (10 DO + 10 Vultr) × per_vm 5.

kind: testnet

ssh_key_path: ~/.ssh/ant_deploy

testnet:
  mode: true
  bootstraps:
    count: 7
    port: 10000

  nodes:
    clock_skew: 1
    per_vm: 5
    providers:
      digital_ocean:
        vm_count: 5
        regions: 2
        size: s-2vcpu-4gb
      vultr:
        vm_count: 5
        regions_list: [ord, lax]
        size: vhp-2c-4gb-intel

  clients:
    uploaders:
      - { provider: digital_ocean, region: lon1, file_size_mb: 10, ant: 200, eth: 0.04 }
      - { provider: digital_ocean, clock_skew: true, region: nyc1, file_size_mb: 10, ant: 200, eth: 0.04 }
    downloaders:
      - { provider: digital_ocean, region: lon1 }
      - { provider: digital_ocean, clock_skew: true, region: lon1 }
