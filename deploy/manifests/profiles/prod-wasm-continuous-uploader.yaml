# Permanent daily production WRITE test over the BROWSER path (WebRTC-Direct).
#
# The same deployment as `prod-continuous-uploader` in every respect except which
# binary the uploader service spawns: `ant-wasm` (ant-core compiled to WASM)
# instead of `ant`. It answers, every day, whether a browser client can still
# write to the real production network — which nothing else does, since `ant-cli`
# links native ant-core and so takes the native transport however it is invoked.
#
# ONE transport per deployment: the browser path measured several times slower, so
# a blended daily series would describe neither instrument. This is a SEPARATE
# deployment from the native PROD-UL-01, with its own daily file quota; the native
# one is untouched.
#
# Before the first deploy, create the scoped registry role the VMs use and export
# the URL it prints:
#
#   saorsa-deploy prod pool client-role
#   export POOL_DATABASE_URL='postgresql://ant_pool_client:...@host/db?sslmode=require'
#   export ARBITRUM_ONE_SECRET_KEY='0x...'   # funded Arbitrum One wallet
#
#   saorsa-deploy deployments plan --config <this file>    # preview the steps
#   saorsa-deploy deployments up   --config <this file>    # build + deploy
#   saorsa-deploy deployments down --name PROD-WUL-01      # tear down
#
# Copy into the git-ignored manifests/runs/ dir and edit per run.

name: PROD-WUL-01
kind: prod-continuous-uploader
purpose: "Daily production write test over the browser path (WebRTC-Direct)"
ssh_key_path: ~/.ssh/ant_deploy

prod_continuous_uploader:
  client_kind: wasm

  # ---- the uploader VM -------------------------------------------------
  # 8 GB minimum, and that is validated on DigitalOcean (the slug encodes its
  # memory): a browser-path transfer holds ~4x the file in WASM memory, so a
  # smaller box turns every upload into an OOM kill — which reads as a network
  # fault rather than as an under-sized VM. Omit the size entirely and it
  # defaults to s-4vcpu-8gb.
  spec: lon1:s-4vcpu-8gb
  provider: digitalocean
  volume_size: 40            # GB. MUST exceed the largest file the pool request
                             # can draw — the source is written to local disk
                             # before upload, and each verifier downloads it back
                             # before hashing.

  # ---- the WASM bundle -------------------------------------------------
  # Built from source by `build ant-wasm`, which `deployments up` emits as a
  # resumable step before the deploy — no ant-core WASM package is published as a
  # release, so `branch:` is the only form. It takes a TAG as readily as a branch
  # (`git clone --branch` accepts either), which is how an RC is pinned.
  wasm_binary:
    branch: ant-cli-v0.3.8-rc.1
    repo_owner: WithAutonomi

  # Override the committed production bootstrap WebRTC multiaddr list if needed.
  # There is deliberately no URL form: nothing publishes these addresses at one.
  # Every entry is ICE-probed before any infrastructure is created; if none
  # answers the deploy refuses, and a partial answer warns and names the dead
  # ones. Refresh the list with `prod bootstrap webrtc-addresses`.
  # wasm_bootstrap_multiaddrs_file: ~/prod-bootstraps.txt

  # ---- what to upload each day ----------------------------------------
  # Files are claimed from the registry AS EACH UPLOAD HAPPENS, so a file is
  # never uploaded twice and a teardown strands nothing.
  #
  # ant-core refuses a browser-path file above 1,000,000,000 bytes, so `large`
  # and `xlarge` are REFUSED at validation (every file in them is over the cap)
  # and a `medium` request is narrowed to it — `plan` shows the narrowed bound,
  # because an operator who wrote `medium` gets a smaller class than they asked
  # for, and a drawn over-cap file is a permanently-spent pool entry.
  pool:
    tiny: 2
    small: 1
  pool_min_size: 5MB         # "tiny, but at least 5 MB": the chunk floor is 4,
                             # so a 14 KB file buys no more observation than a
                             # 5 MB one at the same cost of one pool entry.

  sleep_interval_secs: 86400 # once a day

  # ---- the verifier VMs ------------------------------------------------
  # Deliberately NATIVE, whatever the uploader runs: a digest_mismatch then stays
  # attributable to the browser-path UPLOAD rather than to a browser read. The
  # uploader's own read-back covers the browser read path, and so does
  # `prod downloaders --client-kind wasm`.
  verifiers:
    - region: nyc3
      vm_size: s-1vcpu-2gb
      provider: digitalocean
      volume_size: 40

  verify_interval_secs: 3600      # hourly, epoch-aligned

  # ---- binary ----------------------------------------------------------
  # The native `ant` the VERIFIERS run. The uploader installs none.
  binary:
    version: "0.3.8"

  # ---- credentials (named, never inlined) ------------------------------
  # The same shared wallet as the native daily test. The deploy prints the
  # paying address so its balance can be checked before a run that spends real
  # ETH every day.
  secret_key_env: ARBITRUM_ONE_SECRET_KEY
  pool_database_url_env: POOL_DATABASE_URL

  # ---- monitoring (mandatory) ------------------------------------------
  monitoring_provider: digitalocean
  monitoring_volume_size: 50
  grafana: false

  influx_retention_days: 7   # 0 = infinite
  log_retention_days: 7      # per-op stdout/stderr prune; 0 = keep forever

  # NOT AVAILABLE on this transport, and refused rather than ignored:
  #   bootstrap_cache — selects ant's peer cache vs an explicit --bootstrap;
  #                     a browser client does neither.
  #   log_level       — an `ant` verbosity flag; `ant-wasm` has none and reads
  #                     RUST_LOG straight from its environment.
  # rust_log and payment both work normally.
  # rust_log: "ant_networking=debug"
  # payment: merkle

slack_post: true

# Results: upload rows land in `deployment_prod_upload_results` with
# `client_kind='wasm'` and the SHA-256 of the bytes handed to the uploader;
# read-back and verifier results land in
# `deployment_prod_upload_verifications`. Both are written by the VMs as they
# happen, so `deployments record-results` is a no-op for this kind — read it with
# `deployments print-recorded-results --name PROD-WUL-01`, which labels the
# transport. The Influx copies go to the `wasm-client-metrics` bucket, kept
# separate so no dashboard can average two transports measured several times
# apart.
#
# Pool claims resolve by outcome: a success spends the file, a failure AFTER the
# payment went out marks it partial (chunks are in production, so a canary must
# never draw it), and a failure BEFORE any payment puts it back in the pool
# untouched. An OOM-killed child prints nothing, so the `--payment-marker` file
# is what tells those two apart.
