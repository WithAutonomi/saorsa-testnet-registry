# Base profile: the reusable *shape* of a staging-RC soak testnet.
# A concrete run `extends:` this and overrides only name / purpose / binaries.
# This is how you "re-use a frequent configuration" — edit the run file, not the shape.

kind: testnet

ssh_key_path: ~/.ssh/ant_deploy

testnet:
  mode: true                  # --testnet on genesis/bootstraps/nodes provision

  bootstraps:
    count: 7
    port: 10000

  nodes:
    per_vm: 15
    nat_percent: 30
    attached_volume_size: 100
    providers:
      # vm_count is PER REGION; provider total = vm_count × len(regions_list).
      # `size` maps to the provider's size flag (DO droplet-size / Vultr plan / Hetzner server-type).
      digital_ocean:
        vm_count: 5
        regions_list: [ams3, blr1, fra1, lon1, nyc1, syd1, sgp1]
        size: s-8vcpu-16gb
      vultr:
        vm_count: 5
        regions_list: [ams, ord, lax, lhr, nrt]   # ewr swapped for ord — ewr
                                                   # repeatedly strands VMs in 'pending'
        size: vhp-8c-16gb-intel

  clients:
    uploaders:
      - { provider: vultr, region: syd, file_size_mb: 1000, vm_size: vc2-2c-4gb, payment: merkle,    ant: 1000, eth: 0.1 }
      - { provider: ovh,   region: UK1, file_size_mb: 1000, vm_size: b3-8,       payment: no-merkle, ant: 1000, eth: 0.1 }
      - { provider: vultr, region: ewr, file_size_mb: 500,  vm_size: vc2-2c-4gb, payment: no-merkle, ant: 1000, eth: 0.1 }
      - { provider: vultr, region: ams, file_size_mb: 300,  vm_size: vc2-2c-4gb, payment: no-merkle, ant: 500,  eth: 0.1 }
      - { provider: vultr, region: sjc, file_size_mb: 100,  vm_size: vc2-2c-4gb,                       ant: 500,  eth: 0.1 }
      - { provider: vultr, region: sgp, file_size_mb: 50,   vm_size: vc2-2c-4gb,                       ant: 200,  eth: 0.04 }
      - { provider: vultr, region: sgp, file_size_mb: 25,   vm_size: vc2-2c-4gb,                       ant: 200,  eth: 0.04 }
      - { provider: ovh,   region: DE1, file_size_mb: 20,   vm_size: b3-8,                              ant: 200,  eth: 0.04 }
      - { provider: ovh,   region: BHS5,file_size_mb: 20,   vm_size: b3-8,                              ant: 200,  eth: 0.04 }
      - { provider: ovh,   region: UK1, file_size_mb: 20,   vm_size: b3-8,                              ant: 200,  eth: 0.04 }
    downloaders:
      - { provider: digital_ocean, region: tor1 }
      - { provider: digital_ocean, region: lon1 }

  elastic:
    enabled: true
    droplet_size: s-8vcpu-16gb
    volume_size: 500
    shards: 8

  monitoring:
    enabled: true
