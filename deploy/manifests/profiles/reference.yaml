# Reference profile — every available testnet option, populated with a real value.
#
# This is a complete, valid manifest (run `saorsa-deploy config validate --config
# deploy/manifests/profiles/reference.yaml`). Build a new profile or run by COPYING
# this file and DELETING whatever you don't need — optional blocks (clients, elastic,
# monitoring) can be removed wholesale, and any field left out falls back to the
# saorsa-deploy CLI default.
#
# Comments here are explanatory only; there are no commented-out directives to
# uncomment. Mutually-exclusive forms are shown by example rather than by comment:
#   - binaries.ant_node uses the branch-build form; binaries.ant uses the release form.
#   - nodes.providers.digital_ocean/vultr use `regions_list`; hetzner uses `regions`.

name: REFERENCE              # usually omitted from a base profile and set per-run via --name / the child
kind: testnet                # testnet | testnet-extension | prod-* (see other example manifests)
purpose: "Reference manifest demonstrating every available option"
ssh_key_path: ~/.ssh/ant_deploy   # absolute path or ~; public half must be registered with every provider used

testnet:
  mode: true                 # true => --testnet on genesis/bootstraps/nodes provision
  upgrade_channel: beta      # beta | stable; omit the key entirely for ant-node's built-in default

  binaries:
    # Per binary, choose EITHER the release form ({ version }) OR the branch form
    # ({ branch, repo_owner, validation }) — never both.
    ant_node:                # branch-build form (built from source before provisioning)
      branch: my-feature-branch
      repo_owner: WithAutonomi
      validation: "expected-string-baked-into-the-binary"   # optional --validation-string build sanity check
      debug: true            # optional (branch form only): build WITHOUT --release — a larger,
                             # slower binary with full debug info, for memory profiling. Default off.
    ant:                     # release form (prebuilt GitHub release); required when `clients` is present
      version: 0.2.5-rc.4

  bootstraps:
    count: 7                 # >1 => orchestrator also emits `bootstraps provision`
    port: 10000
    regions_list: [lon1, nyc1, ams3]   # bootstraps infra --do-regions-list; when set it overrides `count`
    attached_volume_size: 100          # GB attached volume per bootstrap VM

  nodes:
    per_vm: 15               # nodes provision --node-count (services per VM)
    nat_percent: 30          # % of node VMs behind simulated port-restricted NAT; omit/0 to disable
    clock_skew: 1            # inject intentional clock skew on N random node VMs (disable timesync + shift clock a few hours); omit/0 to disable
    full_percent: 20         # % of NON-NAT node VMs to make storage-full (pre-fill data volume so nodes reject stores); randomly chosen (not region-spread) so full nodes scatter across the keyspace; always disjoint from nat_percent; omit/0 to disable
    full_headroom_mb: 100    # free space (MiB) to leave when filling; only meaningful with full_percent > 0
    log_level: info          # single ant-node --log-level for EVERY node-tier service (genesis + bootstraps + WAN nodes): info | debug | trace. ant-node has NO per-module / env-filter logging (its --log-level is bound to RUST_LOG and takes one level only) — distinct from the per-client `rust_log` env-filter below. Also auto-lifts the node→ES drop filter (see elastic.drop_log_levels) so debug/trace reaches Elasticsearch, not just disk.
    providers:               # vm_count is PER REGION; provider total = vm_count × number-of-regions
      digital_ocean:
        vm_count: 5
        regions_list: [ams3, blr1, fra1, lon1, nyc1]   # explicit regions
        size: s-8vcpu-16gb                              # → --do-droplet-size
        attached_volume_size: 100                       # GB volume per VM (per-provider; ovh_3az can't have one)
      hetzner:
        vm_count: 1
        regions: 2                                      # region COUNT form (mutually exclusive with regions_list)
        size: cpx32                                     # → --hetzner-server-type
        attached_volume_size: 100
      vultr:
        vm_count: 5
        regions_list: [ams, ewr, lax, lhr, nrt]
        size: vhp-8c-16gb-intel                         # → --vultr-plan
        attached_volume_size: 100
      ovh:                     # 1-AZ OVH regions (have block storage)
        vm_count: 2
        regions_list: [GRA9, UK1, DE1]                  # OVH region names are uppercase
        size: b3-16                                     # → --ovh-flavor; needs OVH_APPLICATION_KEY/SECRET, OVH_CONSUMER_KEY, OVH_CLOUD_PROJECT_SERVICE
        attached_volume_size: 100
      ovh_3az:                 # OVH 3-AZ regions (EU-WEST-PAR, EU-SOUTH-MIL): instances via Nova, NO block storage → root disk only, so NO attached_volume_size (it errors)
        vm_count: 2
        regions_list: [EU-WEST-PAR, EU-SOUTH-MIL]
        size: b3-16                                     # → --ovh-3az-flavor; same OVH credentials as ovh

  clients:                   # optional. Needs >=1 uploader AND >=1 downloader. Remove the block for no clients.
    # forward_logs (per-client) forwards the client ant process's stdout+stderr to
    # the deployment's OWN Elasticsearch (a SEPARATE index telegraf-ant-clients-<name>,
    # never mingled with node logs) — it REQUIRES elastic.enabled below. rust_log
    # (per-client) sets RUST_LOG on the client service, OVERRIDING the -v verbosity
    # flag; in a CLI spec it must come last (its value can contain ':').
    uploaders:               # one --uploader per entry: provider:region:file_size_mb[:vm_size][:payment][:ant][:eth][:clock_skew][:bootstrap_cache][:forward_logs][:rust_log]
      - { provider: vultr,         region: syd,  file_size_mb: 1000, vm_size: vc2-2c-4gb, payment: merkle,    ant: 1000, eth: 0.1, clock_skew: 2h }  # disable timesync + shift this VM's clock by a signed Go-style duration (e.g. 2h, -2h, 30m)
      - { provider: ovh,           region: UK1,  file_size_mb: 500,  vm_size: b3-8,       payment: no-merkle, ant: 500,  eth: 0.1, bootstrap_cache: false, forward_logs: true, rust_log: "ant_cli=info,saorsa_core::dht_network_manager=debug" }  # forward this uploader's ant logs to ES (needs elastic.enabled) and run it at a custom RUST_LOG
      - { provider: digital_ocean, region: nyc1, file_size_mb: 100,  vm_size: s-2vcpu-4gb }   # payment/ant/eth/bootstrap_cache/forward_logs/rust_log omitted => CLI defaults
    downloaders:             # one --downloader per entry: provider:region[:vm_size][:clock_skew][:bootstrap_cache][:forward_logs][:rust_log]
      - { provider: digital_ocean, region: tor1, vm_size: s-2vcpu-4gb, forward_logs: true }   # forward this downloader's ant logs to ES (needs elastic.enabled)
      - { provider: digital_ocean, region: lon1, clock_skew: -2h, bootstrap_cache: false }   # clock_skew applies to downloaders too (negative = clock runs slow); bootstrap_cache likewise per-downloader

  elastic:                   # optional log-forwarding stack. Remove the block (or set enabled: false) to skip.
    enabled: true
    droplet_size: s-8vcpu-16gb   # elastic infra --droplet-size
    volume_size: 500             # GB; bump for large/long testnets
    shards: 8                    # primary shards per daily index (match the ES droplet's vCPU count)
    retention_days: 7            # ILM retention before deletion
    drop_log_levels: DEBUG,TRACE # node forwarder drops these levels before shipping to ES. OMIT to auto-derive from nodes.log_level (trace→keep all, debug→drop only TRACE, info→DEBUG,TRACE). Set explicitly to override — e.g. "" force-keeps everything; "DEBUG,TRACE" keeps verbose logs on disk but out of ES.
    buffer_limit: 2000000        # telegraf output buffer (lines); applied to BOTH the node forwarder and (via clients provision --forward-buffer-limit) the client forwarder — bump for high-volume TRACE runs
    keep_on_destroy: false       # `true` = `deployments down` tears down clients/nodes/bootstraps but LEAVES this ES VM running, so the run's logs stay queryable for a post-mortem. Honoured by both `down --config` and `down --name` (persisted into the elastic S3 state at infra time). Requires enabled: true. Retention is NOT extended — the index still expires on retention_days, so raise that if the investigation needs longer. Clean up afterwards with `elastic destroy --name <name> --force`.

  monitoring:                # InfluxDB metrics stack. ON by default — set
    enabled: true            # `enabled: false` to opt out.
    grafana: false           # Separate Grafana VM for dashboards. OFF by
                             # default (InfluxDB only); set `true` to also
                             # stand up a Grafana VM. Data stays queryable via
                             # InfluxDB/Flux regardless.
    keep_on_destroy: false   # `true` = `deployments down` leaves the InfluxDB
                             # (+ Grafana) VM(s) running so the run's metrics stay
                             # queryable after the testnet is gone. Same semantics
                             # as elastic.keep_on_destroy above; the testnet bucket's
                             # retention is infinite by default, so kept metrics
                             # persist. Clean up with `monitoring destroy --name
                             # <name> --force`.
