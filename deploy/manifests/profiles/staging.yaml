# staging.yaml
#
# THE staging profile — the one every release train's staging run extends. It
# replaces the former staging-short / staging-rc / staging-*-wasm family, which
# had diverged into five near-identical files nobody could tell apart.
#
# Full-scale (~990 nodes): 7 bootstraps, ~1000 node services, a NATIVE client
# tier of 10 uploaders + 2 downloaders, a WASM (browser-path) client tier of 3
# uploaders + 1 downloader ADDED on top of it, Elasticsearch, InfluxDB
# monitoring and a Slack post.
#
# The WASM tier arrived with the first train to carry WebRTC-Direct by default,
# and it changed both the workload and the NAT fraction — so the first run on
# this profile is a full REBASELINE. No run recorded before it is a valid
# baseline for one recorded after it.
#
# Geographic distribution (one tier per role):
#   * EU  -> OVH, UNMETERED bandwidth ($0 egress):
#       - 1-AZ regions (RBX-A/SBG5/DE1): have block storage, so nodes attach a volume.
#       - 3-AZ regions (EU-WEST-PAR/EU-SOUTH-MIL) via the `ovh_3az` provider: OVH's
#         native API 500s on user_data/AZ there, so these go through OpenStack/Nova;
#         3-AZ has NO block storage, so they run ROOT-DISK-ONLY (b3-16 ~94 GB usable)
#         and MUST NOT set attached_volume_size (it errors). Empty regions with 40
#         free cores each, so this is where extra free-bandwidth nodes are added.
#   * North America -> Vultr (metered). ord/lax are the proven-safe NA regions.
#   * Asia/Pacific -> DigitalOcean (metered). blr1/sgp1/syd1 (India/Singapore/Sydney).
# Vultr and DO cost the same per GB ($0.01 overage, 6 TB/mo on the 8-vCPU plans),
# so the split is by region reliability, not price. OVH carries ~55% of nodes free.

kind: testnet

ssh_key_path: ~/.ssh/ant_deploy
slack_post: true

testnet:
  mode: true

  bootstraps:
    count: 7
    port: 10000
    attached_volume_size: 50
    # `webrtc_port` is deliberately NOT pinned here. Left unset, ant-node DERIVES
    # the WebRTC-Direct port from `port` above — which is fixed in this profile,
    # so the derived port is stable across runs anyway. And the port is only half
    # of a browser-facing address: the multiaddr also embeds the DTLS certhash,
    # which does not exist until the node has started, so `deployments
    # webrtc-addresses` collects the real addresses at run time regardless. The
    # derived port is the documented behaviour and is what DEV-03 ran with.

  nodes:
    clock_skew: 1
    per_vm: 15
    # Reduced from 30 for the WASM tier: WebRTC-Direct has no NAT traversal, so
    # a node behind the simulated inbound NAT is unreachable to a browser-path
    # client and each dial burns a 10s DataChannel timeout. 10% keeps some NAT
    # in the native measurement without drowning the WASM one. Raise it again
    # once relayed WebRTC exists.
    nat_percent: 10
    providers:
      # EU — OVH 1-AZ (unmetered; regions have block storage). 6*3 = 18 VMs.
      ovh:
        vm_count: 6
        regions_list: [RBX-A, SBG5, DE1]
        size: b3-16
        attached_volume_size: 100
      # EU — OVH 3-AZ (unmetered; NO block storage -> root-disk only, no volume).
      # 9*2 = 18 VMs; the extra free-bandwidth capacity vs the metered tiers.
      ovh_3az:
        vm_count: 9
        regions_list: [EU-WEST-PAR, EU-SOUTH-MIL]
        size: b3-16
      # North America — Vultr (metered). 6*2 = 12 VMs.
      vultr:
        vm_count: 6
        regions_list: [ord, lax]
        size: vhp-8c-16gb-intel
        attached_volume_size: 100
      # Asia/Pacific — DigitalOcean (metered). 6*3 = 18 VMs (incl. syd1 Sydney).
      digital_ocean:
        vm_count: 6
        regions_list: [blr1, sgp1, syd1]
        size: s-8vcpu-16gb
        attached_volume_size: 100

  clients:
    # forward_logs/rust_log added across the fleet 2026-07-30 to measure the
    # client-log volume this generates against the staging elastic config
    # before deciding whether/how to enable it for a real release-train run.
    uploaders:
      - { provider: ovh,   region: SBG5, file_size_mb: 1000, vm_size: b3-8,      payment: merkle,    ant: 1000, eth: 0.9, forward_logs: true, rust_log: info }
      - { provider: ovh, clock_skew: 2h,   region: UK1, file_size_mb: 1000, vm_size: b3-8,       payment: no-merkle, ant: 1000, eth: 0.9, forward_logs: true, rust_log: info }
      - { provider: vultr, clock_skew: -2h, region: ewr, file_size_mb: 500,  vm_size: vc2-2c-4gb, payment: merkle, ant: 1000, eth: 0.6, forward_logs: true, rust_log: info }
      - { provider: vultr, region: ams, file_size_mb: 300,  vm_size: vc2-2c-4gb, payment: no-merkle, ant: 500,  eth: 0.55, forward_logs: true, rust_log: info }
      - { provider: vultr, region: sjc, file_size_mb: 100,  vm_size: vc2-2c-4gb,                       ant: 500,  eth: 0.5, forward_logs: true, rust_log: info }
      - { provider: vultr, region: sgp, file_size_mb: 50,   vm_size: vc2-2c-4gb,                       ant: 200,  eth: 0.25, forward_logs: true, rust_log: info }
      - { provider: vultr, region: sgp, file_size_mb: 25,   vm_size: vc2-2c-4gb,                       ant: 200,  eth: 0.2, forward_logs: true, rust_log: info }
      - { provider: ovh,   region: DE1, file_size_mb: 20,   vm_size: b3-8,                              ant: 200,  eth: 0.3, forward_logs: true, rust_log: info }
      - { provider: ovh,   region: RBX-A,file_size_mb: 20,   vm_size: b3-8,                             ant: 200,  eth: 0.3, forward_logs: true, rust_log: info }
      - { provider: ovh, clock_skew: 2h,   region: UK1, file_size_mb: 20,   vm_size: b3-8,                              ant: 200,  eth: 0.3, forward_logs: true, rust_log: info }
    downloaders:
      - { provider: digital_ocean, region: tor1, forward_logs: true, rust_log: info }
      - { provider: digital_ocean, clock_skew: -2h, region: lon1, forward_logs: true, rust_log: info }

    # WASM (browser-path) tier, ADDED on top of the native tier (not a swap).
    # 900 not 1000: ant-core caps a browser upload at 1,000,000,000 bytes and
    # file_size_mb is binary (validator on WasmUploader enforces it).
    # Funding = the native twin's ETH/ANT at the same size.
    #
    # OVH per-region vCPU headroom, checked against the project's live quota on
    # 2026-09-23: the limit is 64 cores per region (not the 40 it once was),
    # b3-16 is 4 vCPU and b3-8 is 2. With these two entries SBG5 and RBX-A each
    # run 6*b3-16 nodes + 2*b3-8 clients = 28 of 64 vCPU, so neither needs
    # moving to Vultr.
    wasm_uploaders:
      - { provider: ovh,   region: SBG5,  file_size_mb: 900, vm_size: b3-8,       payment: merkle,    ant: 1000, eth: 0.9,  forward_logs: true, rust_log: info }
      - { provider: vultr, region: ams,   file_size_mb: 300, vm_size: vc2-2c-4gb, payment: no-merkle, ant: 500,  eth: 0.55, forward_logs: true, rust_log: info }
      - { provider: ovh,   region: RBX-A, file_size_mb: 20,  vm_size: b3-8,                           ant: 200,  eth: 0.3,  forward_logs: true, rust_log: info }
    # 8 GB: a browser-path download holds the whole file in WASM memory
    # (~4x file size; 900 MB measured 3.88 GB RSS). 4 GB VMs get OOM-killed.
    wasm_downloaders:
      - { provider: digital_ocean, region: tor1, vm_size: s-4vcpu-8gb, forward_logs: true, rust_log: info }

    # Pointer tier (V2-1339): paid, owner-signed mutable references. Two entries
    # on DigitalOcean, lon1 and syd1 — geographically separated on purpose, so
    # every pointer is read from a nearby AND a distant vantage point. A pointer
    # read is answered by a quorum of its close group; whether that quorum agrees
    # is not something one client can observe alone. A second PROVIDER is
    # supported and deliberately not used: distance is what matters here, and two
    # providers would add a variable that is not being measured.
    #
    # THE RC MUST CARRY POINTERS (V2-1277). A pre-pointer ant-node answers a
    # protocol error to every pointer message, so on a train whose RC predates
    # them the run operator strips these two entries for that train.
    #
    # Rates left at their defaults: 180 paid writes per client per hour, one
    # Arbitrum Sepolia transaction every 20s. `clients estimate-gas` sizes the
    # `eth:` below straight from them — no baseline needed, they are
    # deterministic.
    #
    # NO forward_logs here, unlike every entry above. The pointer service logs a
    # line per operation and performs thousands over a run; the client-log volume
    # measurement those flags exist for was taken on the transfer tier, and
    # adding an unmeasured source to it would spoil the comparison.
    pointers:
      - { provider: digital_ocean, region: lon1, vm_size: s-2vcpu-4gb, ant: 200, eth: 0.5 }
      - { provider: digital_ocean, region: syd1, vm_size: s-2vcpu-4gb, ant: 200, eth: 0.5 }

  elastic:
    enabled: true
    droplet_size: s-8vcpu-16gb
    volume_size: 500
    shards: 8

  monitoring:
    enabled: true
