# staging-rc with a WASM (browser-path) client tier.
#
# Same node fleet, bootstraps, elastic and monitoring as staging-rc.yaml — only
# the client tier and nat_percent differ, so a run against this profile is
# comparable to a staging-rc run on everything except the clients.
#
# Like staging-rc.yaml this is a BASE profile: a run `extends:` it and supplies
# name/purpose/binaries. Those binaries must include `ant_wasm` (branch form —
# no ant-core WASM package is published as a release), or validation refuses the
# manifest.
#
# Three of the ten uploaders and one of the two downloaders move to the WASM
# tier rather than being added alongside it, so the run's total client VM count
# and its spread of file sizes, regions, providers, payment modes and clock skew
# are unchanged from staging-rc.

kind: testnet

ssh_key_path: ~/.ssh/ant_deploy

testnet:
  mode: true
  bootstraps:
    count: 7
    port: 10000
    attached_volume_size: 50

  nodes:
    clock_skew: 1
    per_vm: 15
    # 0, not staging-rc's 30: WebRTC-Direct has no NAT traversal yet, so a NAT'd
    # node is simply unreachable to a browser client and every dial to one burns
    # a 10s DataChannel timeout. NB this also means a run against this profile is
    # NOT comparable to a staging-rc run on any node-tier metric that NAT affects.
    nat_percent: 0
    providers:
      digital_ocean:
        vm_count: 5
        regions_list: [ams3, blr1, fra1, lon1, nyc1, syd1, sgp1]
        size: s-8vcpu-16gb
        attached_volume_size: 100
      vultr:
        vm_count: 5
        regions_list: [ams, ord, lax, lhr, nrt]
        size: vhp-8c-16gb-intel
        attached_volume_size: 100

  clients:
    uploaders:
      - { provider: vultr, region: syd, file_size_mb: 1000, vm_size: vc2-2c-4gb, payment: merkle,    ant: 1000, eth: 0.1 }
      - { provider: vultr, clock_skew: -2h, region: ewr, file_size_mb: 500,  vm_size: vc2-2c-4gb, payment: merkle, ant: 1000, eth: 0.1 }
      - { provider: vultr, region: sjc, file_size_mb: 100,  vm_size: vc2-2c-4gb,                       ant: 500,  eth: 0.1 }
      - { provider: vultr, region: sgp, file_size_mb: 50,   vm_size: vc2-2c-4gb,                       ant: 200,  eth: 0.04 }
      - { provider: vultr, region: sgp, file_size_mb: 25,   vm_size: vc2-2c-4gb,                       ant: 200,  eth: 0.04 }
      - { provider: ovh,   region: DE1, file_size_mb: 20,   vm_size: b3-8,                              ant: 200,  eth: 0.04 }
      - { provider: ovh, clock_skew: 2h,   region: UK1, file_size_mb: 20,   vm_size: b3-8,                              ant: 200,  eth: 0.04 }
    downloaders:
      - { provider: digital_ocean, clock_skew: -2h, region: lon1 }
    # WASM (browser-path) clients: ant-core compiled to WASM, over WebRTC-Direct.
    # No `bootstrap_cache` key on these — a WASM client bootstraps from the
    # deployment's webrtc-direct addresses, not from ant's peer cache.
    wasm_uploaders:
      - { provider: ovh, clock_skew: 2h,   region: UK1, file_size_mb: 1000, vm_size: b3-8,       payment: no-merkle, ant: 1000, eth: 0.1 }
      - { provider: vultr, region: ams, file_size_mb: 300,  vm_size: vc2-2c-4gb, payment: no-merkle, ant: 500,  eth: 0.1 }
      - { provider: ovh,   region: BHS5,file_size_mb: 20,   vm_size: b3-8,                              ant: 200,  eth: 0.04 }
    wasm_downloaders:
      - { provider: digital_ocean, region: tor1 }

  elastic:
    enabled: true
    droplet_size: s-8vcpu-16gb
    volume_size: 500
    shards: 8

  monitoring:
    enabled: true
