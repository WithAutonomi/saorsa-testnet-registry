name: saorsa-testnet-registry
region: lon1

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

services:
  - name: saorsa-testnet-registry-web
    github:
      repo: maidsafe/saorsa-testnet-registry
      branch: main
      deploy_on_push: false
    source_dir: web
    dockerfile_path: web/Dockerfile
    run_command: sh -c "alembic upgrade head && gunicorn wsgi:app --bind 0.0.0.0:8080 --workers 2"
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${dev-db-722203.DATABASE_URL}
      - key: FLASK_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: WORKFLOW_RUNNER_PAT
        scope: RUN_TIME
        type: SECRET
      - key: GITHUB_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: GITHUB_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET

workers:
  - name: monitor
    github:
      repo: maidsafe/saorsa-testnet-registry
      branch: main
      deploy_on_push: false
    source_dir: web
    dockerfile_path: web/Dockerfile
    run_command: registry-monitor monitor --interval 60
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${dev-db-722203.DATABASE_URL}

databases:
  - name: dev-db-722203
    engine: PG
    version: "17"
