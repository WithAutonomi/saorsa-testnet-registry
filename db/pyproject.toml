[project]
name = "saorsa-db"
version = "0.2.4"
description = "Shared database models and repositories for the Saorsa Testnet Registry"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.1",
    "alembic>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saorsa_db"]
