[project]
name = "saorsa-db"
version = "1.4.3"
description = "Shared database models and repositories for the Saorsa Testnet Registry"
# 3.12, not 3.13, because this package is installed on client VMs (V2-837):
# the daily production write test claims pool files from the registry over the
# network, and the VM images are Ubuntu 24.04, whose system Python is 3.12.
# Nothing here uses 3.13-only syntax or stdlib; the floor is verified by
# `uv run --python 3.12 --isolated ...` in CI-equivalent checks, not assumed.
# The other workspace packages keep their own, higher floors.
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    # Both PostgreSQL drivers: SQLAlchemy 2.0 resolves a driver-less
    # postgresql:// URL to psycopg2, 2.1 resolves it to psycopg 3. Every venv
    # that installs this package must work with whichever it resolved.
    "psycopg2-binary>=2.9",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.1",
    "alembic>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saorsa_db"]
